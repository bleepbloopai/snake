<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://snake.bleepbloop-ai.workers.dev">
<style>
  :root {
    --bar: #4a752c; --page: #578a34; --a: #aad751; --b: #a2d149;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); display: flex; align-items: center; justify-content: center;
    font-family: "Google Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    padding: 56px 0 12px;      /* keeps the board clear of the Leaderboards / Settings buttons */
  }
  /* board = biggest size that fits the screen width AND height (bar 56px + top buttons 56px + margin 12px), max ~48px squares */
  .game { width: min(96vw, var(--maxw, 612px), calc((100vh - 124px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * var(--ar, 1))); }
  @supports (height: 100dvh) {
    .game { width: min(96vw, var(--maxw, 612px), calc((100dvh - 124px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * var(--ar, 1))); }
  }
  .bar {
    background: var(--bar); color: #fff; height: 56px; padding: 0 18px;
    display: flex; align-items: center; justify-content: center; gap: 36px;
    border-radius: 8px 8px 0 0; font-size: 22px; font-weight: 600;
  }
  .stat { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .stat img { width: 30px; height: 30px; object-fit: contain; }
  .stat span { display: inline-block; }
  .stat span.pop { animation: pop .28s ease; }
  @keyframes pop { 50% { transform: scale(1.35); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  .overlay.show h2, .overlay.show p { animation: rise .35s ease both; }
  .stage { position: relative; line-height: 0; }
  canvas { width: 100%; display: block; border-radius: 0 0 8px 8px; touch-action: none; outline: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; line-height: 1.3; text-align: center; color: #fff;
    background: rgba(30, 55, 15, .45); border-radius: 0 0 8px 8px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .overlay.show { opacity: 1; }
  .overlay h2 { margin: 0; font-size: clamp(24px, 6vw, 40px); font-weight: 700; }
  .overlay p { margin: 0; font-size: clamp(14px, 3.2vw, 18px); opacity: .92; }
  .overlay button {
    pointer-events: none; font: inherit; font-weight: 700; font-size: clamp(16px, 3.6vw, 20px);
    color: #fff; background: #4e7cf6; border: 0; border-radius: 28px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 3px 0 #2f55c4; transition: transform .1s ease;
  }
  .overlay.show button { pointer-events: auto; }
  .overlay button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2f55c4; }
  .overlay button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .overlay { justify-content: flex-start; overflow-y: auto; padding: 14px; }
  .overlay > * { flex: none; }
  .overlay [hidden] { display: none !important; }
  #ovTitle { margin-top: auto; }
  #ovBtn { margin-bottom: auto; }
  .overlay.show #settings { pointer-events: auto; }
  #settings { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  #settings label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #settings select, #settings input {
    font: inherit; font-size: 15px; padding: 6px 12px; border: 0; border-radius: 16px;
    color: #1f2b1a; background: #fff; text-align: center;
  }
  #settings input { width: 70px; }
  #lbBtn, #setBtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 5; font: inherit; font-size: 14px; font-weight: 700;
    color: #fff; background: var(--bar); border: 0; border-radius: 20px; padding: 8px 14px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  #lbBtn img, #setBtn img { width: 18px; height: 18px; object-fit: contain; vertical-align: -3px; }
  #setBtn { left: auto; right: 10px; }
  #lbModal, #setModal { position: fixed; inset: 0; z-index: 10; background: rgba(20,40,10,.6); display: flex; align-items: center; justify-content: center; padding: 12px; }
  #lbModal[hidden], #setModal[hidden] { display: none; }
  #lbCard, #setCard { background: var(--bar); color: #fff; border-radius: 12px; width: min(780px, 100%); max-height: 100%; overflow-y: auto; padding: 16px 18px; }
  #setCard { width: min(420px, 100%); }
  #lbHead, #setHead { display: flex; justify-content: space-between; align-items: center; }
  #lbHead h2, #setHead h2 { margin: 0; font-size: 22px; }
  #lbClose, #setClose { font: inherit; font-size: 22px; color: #fff; background: none; border: 0; cursor: pointer; }
  #setGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 14px; }
  #setGrid label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
  #setGrid select { font: inherit; font-size: 15px; padding: 8px 12px; border: 0; border-radius: 16px; color: #1f2b1a; background: #fff; }
  #setGrid input[type=color] { width: 100%; height: 38px; border: 0; border-radius: 16px; padding: 3px 6px; background: #fff; cursor: pointer; }
  #setReset { font: inherit; font-weight: 700; font-size: 14px; color: #fff; background: #4e7cf6; border: 0; border-radius: 20px; padding: 8px 16px; margin-top: 16px; cursor: pointer; box-shadow: 0 2px 0 #2f55c4; }
  #setNote { margin: 12px 0 0; font-size: 12px; opacity: .85; line-height: 1.35; }
  .lbMap h3 { margin: 14px 0 6px; font-size: 16px; }
  .lbRow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .lbBox { background: rgba(255,255,255,.1); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .lbBox h4 { margin: 0 0 4px; font-size: 13px; opacity: .85; }
  .lbBox ol { margin: 0; padding: 0; list-style: none; }
  .lbBox li { display: flex; gap: 6px; padding: 1px 0; }
  .lbBox .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .lbBox .rk { width: 16px; opacity: .7; }
  #savedNote { font-size: 14px; }
  #changeName { padding: 0; margin-left: 6px; font-size: 13px; background: none; box-shadow: none; border-radius: 0; text-decoration: underline; }
  #nameForm { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #nameInput {
    font: inherit; font-size: 16px; width: 180px; padding: 10px 16px; border: 0; border-radius: 24px;
    color: #1f2b1a; background: #fff; pointer-events: none; text-align: center;
  }
  .overlay.show #nameInput { pointer-events: auto; }
  #nameInput:focus-visible { outline: 3px solid #4e7cf6; outline-offset: 2px; }
  #saveBtn { padding: 10px 22px; font-size: 16px; }
  #saveBtn:disabled { opacity: .6; cursor: default; }
  #boardNote { font-size: 13px; opacity: .88; margin-bottom: 4px; }
  #board { list-style: none; margin: 0 auto; padding: 0; width: min(300px, 86%); font-size: 15px; line-height: 1.25; text-align: left; }
  #board li { display: flex; align-items: flex-start; gap: 8px; padding: 3px 8px; border-radius: 6px; }
  #board .rk { width: 22px; opacity: .75; }
  #board .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #board .sc { font-variant-numeric: tabular-nums; }
  #board .me { background: rgba(255,255,255,.24); font-weight: 700; }
  /* Performance Mode: drop CSS animations/transitions */
  .perf .overlay { transition: none; }
  .perf .overlay.show h2, .perf .overlay.show p, .perf .stat span.pop { animation: none; }
</style>
</head>
<body>
<button id="lbBtn" type="button"><img src="trophy.png" alt=""> Leaderboards</button>
<button id="setBtn" type="button"><img src="cog.png" alt=""> Settings</button>
<div id="lbModal" hidden>
  <div id="lbCard" role="dialog" aria-label="Leaderboards">
    <div id="lbHead"><h2>Leaderboards · Top 5</h2><button id="lbClose" type="button" aria-label="Close">✕</button></div>
    <div id="lbBody"></div>
  </div>
</div>
<div id="setModal" hidden>
  <div id="setCard" role="dialog" aria-label="Settings">
    <div id="setHead"><h2>Settings</h2><button id="setClose" type="button" aria-label="Close">✕</button></div>
    <div id="setGrid">
      <label>Snake color <input id="setSnake" type="color" value="#4e7cf6"></label>
      <label>Map color <input id="setMapColor" type="color" value="#aad751"></label>
      <label>Performance mode <select id="setPerf"><option value="off">Off</option><option value="on">On</option></select></label>
      <label>Sound <select id="setSound"><option value="on">On</option><option value="off">Off</option></select></label>
    </div>
    <button id="setReset" type="button">Reset colors</button>
    <p id="setNote">Performance mode removes shadows, particles, screen shake and animations, and draws at 1x resolution.</p>
  </div>
</div>
<div class="game">
  <div class="bar">
    <div class="stat" title="Score">
      <img src="apple.png" alt="">
      <span id="score">0</span>
    </div>
    <div class="stat" title="Best">
      <img src="trophy.png" alt="">
      <span id="best">0</span>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="Snake game board"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">Snake</h2>
      <p id="ovSub">Press an arrow key or swipe to start</p>
      <div id="settings">
        <label>Speed <select id="setSpeed"><option value="slow">Slow</option><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
        <label>Map <select id="setMap"><option value="small">Small</option><option value="standard">Standard</option><option value="large">Large</option><option value="infinite">Infinite</option></select></label>
        <label>Apples <input id="setApples" type="number" min="1" value="1"></label>
      </div>
      <form id="nameForm" hidden autocomplete="off">
        <input id="nameInput" maxlength="12" placeholder="Your name" aria-label="Your name" required>
        <button id="saveBtn" type="submit">Save score</button>
      </form>
      <div id="savedNote" hidden><span id="savedText"></span><button id="changeName" type="button">Change name</button></div>
      <div id="boardWrap" hidden>
        <div id="boardNote"></div>
        <ol id="board"></ol>
      </div>
      <button id="ovBtn" type="button">Play</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  let COLS = 17, ROWS = 15, LW, LH; const CELL = 40;           // logical units

  // Deployed leaderboard Worker URL (no trailing slash; the game adds /scores itself)
  const API_URL = "https://snake.bleepbloop-ai.workers.dev";

  const SPEEDS = { slow: 179.55, normal: 1000 / 7.41, fast: 89.1 };     // ms per square (5.57 / 7.41 / 11.22 squares per second)
  const MAPS = { small: [9, 10], standard: [15, 17], large: [21, 24], infinite: [17, 15] };  // [columns, rows]
  const DEF_SNAKE = "#4e7cf6", DEF_MAP = "#aad751";
  let cfg = { speed: "normal", map: "standard", apples: 1, perf: "off", sound: "on", snakeColor: DEF_SNAKE, mapColor: DEF_MAP };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem("snake-cfg"))); } catch (e) {}
  if (!SPEEDS[cfg.speed]) cfg.speed = "normal";
  if (!MAPS[cfg.map]) cfg.map = "standard";
  if (cfg.perf !== "on") cfg.perf = "off";
  if (cfg.sound !== "off") cfg.sound = "on";
  if (!/^#[0-9a-f]{6}$/i.test(cfg.snakeColor)) cfg.snakeColor = DEF_SNAKE;
  if (!/^#[0-9a-f]{6}$/i.test(cfg.mapColor)) cfg.mapColor = DEF_MAP;
  const saveCfg = () => { try { localStorage.setItem("snake-cfg", JSON.stringify(cfg)); } catch (e) {} };
  let INF = false, PERF = false, SNAKE = DEF_SNAKE, tileA = DEF_MAP, tileB = "#a2d149", curMode = "standard-normal";    // curMode = leaderboard for the run being played
  const modeName = () => curMode.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" · ");

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const scoreEl = $("score"), bestEl = $("best"), overlay = $("overlay");
  const ovTitle = $("ovTitle"), ovSub = $("ovSub"), ovBtn = $("ovBtn");
  const nameForm = $("nameForm"), nameInput = $("nameInput"), saveBtn = $("saveBtn");
  const boardWrap = $("boardWrap"), boardNote = $("boardNote"), boardEl = $("board");
  const savedNote = $("savedNote"), savedText = $("savedText"), changeName = $("changeName");
  const settingsEl = $("settings"), setSpeed = $("setSpeed"), setMap = $("setMap"), setApples = $("setApples");
  const setSnake = $("setSnake"), setMapColor = $("setMapColor"), setPerf = $("setPerf"), setSound = $("setSound");

  const DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  const KEYMAP = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
                   w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };

  let best = 0;
  try { best = parseInt(localStorage.getItem("snake-best"), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, prev, dir, queue, food, foodBorn, score, delay, state, acc, last, deathAt, overTimer, grew, waiting = false, cdT = 0, foods = [], ang = 0, shake = 0, lastFrame = 0, particles = [], wallSeed = 0;
  // state: ready | running | paused | countdown | over | won

  let runId = 0, pendingSave = null;

  /* ---------- walls (infinite mode only): procedural, so they appear as you explore ---------- */
  const hash = (x, y, s) => {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  function isWall(x, y) {
    if (!INF) return false;
    if (x > -4 && x < 16 && Math.abs(y - Math.floor(ROWS / 2)) < 4) return false;      // safe zone around the start
    const v = hash(x, y, wallSeed);
    return v < 0.015 || (v < 0.5 && hash(x >> 1, y >> 1, wallSeed + 7) < 0.07);        // lone tiles + small clumps
  }

  /* ---------- theme (map color drives board + page + bar) ---------- */
  function mixc(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    return "#" + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v * f).toString(16).padStart(2, "0")).join("");
  }
  function applyTheme() {
    const def = cfg.mapColor.toLowerCase() === DEF_MAP, r = document.documentElement.style;
    tileA = cfg.mapColor; tileB = def ? "#a2d149" : mixc(cfg.mapColor, .955);
    r.setProperty("--page", def ? "#578a34" : mixc(cfg.mapColor, .62));
    r.setProperty("--bar", def ? "#4a752c" : mixc(cfg.mapColor, .52));
  }
  function applyLook() {
    PERF = cfg.perf === "on"; document.body.classList.toggle("perf", PERF);
    SNAKE = cfg.snakeColor; applyTheme();
    setSnake.value = cfg.snakeColor; setMapColor.value = cfg.mapColor; setPerf.value = cfg.perf; setSound.value = cfg.sound;
  }

  /* ---------- polish: sound + particles ---------- */
  let actx = null, muted = cfg.sound === "off";
  function beep(f1, f2, dur, type = "sine", vol = .07) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  function burst(x, y) {
    if (PERF) return;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.283, v = 70 + Math.random() * 150;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

/* ---------- name filter: profanity, slurs, emails, phone numbers (incl. leetspeak like b1tch / a55 / 455 / 304) ---------- */
const NAME_STRONG = ["fuck","fck","shit","bitch","cunt","pussy","asshole","dickhead","cocksucker","whore","slut","jizz","penis","vagina","dildo","blowjob","handjob","orgasm","bastard","wanker","bollocks","titties","tranny","shemale","retard","faggot","nigger","nigga","kike","chink","gook","wetback","hitler","kkk","rapist","porn","christkiller","christkillers","ethniccleansing","gaschamber","gaschambers","heilhitler","jewboy","jewboys","jewslur","jigaboo","jigaboos","kyke","kykes","lesbo","lesbos","masterrace","mohammedan","mohammedans","muslimterrorist","muslimterrorists","neonazi","neonazis","nazism","negroid","pickaninny","porchmonkey","porchmonkeys","racewar","racialpurity","raghead","ragheads","redskin","redskins","schutzstaffel","siegheil","swastika","thirdreich","towelhead","towelheads","trannies","whitegenocide","whitepower","whitesupremacist","whitesupremacy","zipperhead","zipperheads","spastic","mongoloid","fascist","fascists","jewess","nigguh","niggur"];
const NAME_WEAK = ["ass","asses","arse","tit","tits","titty","boob","boobs","dick","dicks","cock","cocks","cum","anal","sex","hoe","hoes","thot","milf","horny","fag","fags","dyke","spic","spics","coon","negro","paki","pakis","beaner","prick","twat","rape","damn","hell","crap","nude","nudes","slag","homo","kys","fuk","fuking","fuker","nazi","nazis","ableist","ape","apes","barbarian","bigot","bigots","coons","cracker","crackers","cripple","crippled","curry","curryface","dykes","heathen","heathens","heeb","heebs","heil","homos","idiot","idiots","imbecile","infidel","infidels","injun","injuns","islamist","jap","japs","jew","jews","jewish","kraut","krauts","mong","monkey","monkeys","nip","nips","oriental","papist","papists","queer","reich","reichs","sambo","sambos","sieg","spade","spades","spaz","spick","spicks","squaw","squaws","tard","tards","teabag","teabags"];
// letters may be stretched (fuuuck); a doubled letter in the word must stay doubled (ass != as)
const nameRx = w => w.replace(/(.)\1*/g, (m, c) => c + (m.length > 1 ? "{" + m.length + ",}" : "+"));
const STRONG_RX = NAME_STRONG.map(w => new RegExp(nameRx(w)));
const WEAK_RX = NAME_WEAK.map(w => new RegExp("^" + nameRx(w) + "$"));
const LEET = { "0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","8":"b","9":"g","@":"a","$":"s","!":"i","+":"t","(":"c","|":"i","€":"e","£":"l" };
const CALC = { ...LEET, "4":"h","7":"l" };                     // calculator spelling: 304 upside down = "hoe"
const deleet = (t, map) => t.replace(/[0-9@$!+(|€£]/g, c => map[c] || c);
function nameVariants(t) {
  const v = [deleet(t, LEET), deleet(t, CALC)];
  if (/\d/.test(t)) v.push(...v.map(x => [...x].reverse().join("")));   // reversed only when digits are involved
  return v;
}
function isBadName(raw) {
  const s = String(raw || "");
  if (/@|https?:|www\.|\.(com|net|org|io|gg|co|me|us|edu|gov|xyz|app|dev)\b/i.test(s)) return true;           // emails / links
  if (/\b(gmail|yahoo|hotmail|outlook|icloud|proton)\b|\bdot\s*com\b|[\[(]\s*at\s*[\])]/i.test(s)) return true;
  if ((s.match(/\d/g) || []).length >= 7) return true;                                                          // phone numbers
  const base = s.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  const skip = "[^a-z0-9@$!+(|€£]";
  if (nameVariants(base.replace(new RegExp(skip, "g"), "")).some(v => STRONG_RX.some(r => r.test(v)))) return true;  // f.u.c.k
  const toks = base.split(new RegExp(skip + "+")).filter(Boolean), joined = [];
  let run = "";
  for (const t of toks) { if (t.length === 1) run += t; else { if (run) joined.push(run); run = ""; joined.push(t); } }
  if (run) joined.push(run);                                                   // "j e w" -> "jew"
  for (const t of toks.concat(joined))
    for (const c of [t, t.replace(/^\d+|\d+$/g, "")].filter(Boolean))                                            // ass69 -> ass
      if (nameVariants(c).some(v => WEAK_RX.some(r => r.test(v)) || STRONG_RX.some(r => r.test(v)))) return true;
  return false;
}


  /* ---------- leaderboard (global via Worker, local fallback) ---------- */
  const LOCAL_KEY = "snake-board";
  const getLocal = m => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY + ":" + m)) || []; } catch (e) { return []; } };

  async function loadBoard(mode) {
    if (API_URL) {
      try {
        const r = await fetch(API_URL + "/scores?mode=" + mode);
        if (r.ok) return { rows: await r.json(), global: true };
      } catch (e) {}
    }
    return { rows: getLocal(mode), global: false };
  }

  async function postScore(name, sc, mode) {
    if (API_URL) {
      for (let attempt = 0; attempt < 2; attempt++) {     // one retry if the 3s cooldown rejects us
        try {
          const r = await fetch(API_URL + "/scores", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, score: sc, mode })
          });
          if (r.ok) return { rows: await r.json(), global: true };
          if (r.status !== 429) break;
        } catch (e) { break; }
        await new Promise(res => setTimeout(res, 3200));
      }
    }
    const rows = getLocal(mode);
    rows.push({ name, score: sc, t: Date.now() });
    rows.sort((a, b) => b.score - a.score || a.t - b.t);
    rows.length = Math.min(rows.length, 10);
    try { localStorage.setItem(LOCAL_KEY + ":" + mode, JSON.stringify(rows)); } catch (e) {}
    return { rows, global: false };
  }

  function renderBoard(res, me) {
    boardWrap.hidden = false;
    boardNote.textContent = res.global ? "Global top 10 · " + modeName()
      : API_URL ? "Can't reach the global board. Showing scores on this device."
      : "Global board not connected. Showing scores on this device.";
    boardEl.textContent = "";
    let marked = false;
    res.rows.filter(r => !isBadName(r.name)).slice(0, 10).forEach((r, i) => {
      const li = document.createElement("li");
      if (me && !marked && r.name === me.name && r.score === me.score) { li.className = "me"; marked = true; }
      for (const [cls, txt] of [["rk", i + 1], ["nm", r.name], ["sc", r.score]]) {
        const sp = document.createElement("span"); sp.className = cls; sp.textContent = txt; li.appendChild(sp);
      }
      boardEl.appendChild(li);
    });
    if (!res.rows.length) boardNote.textContent += " No scores yet.";
  }

  function showSaved(n) {
    savedText.textContent = "Saved as " + n + " · scores autosave"; changeName.hidden = false; savedNote.hidden = false;
  }
  changeName.addEventListener("click", () => {
    try { localStorage.removeItem("snake-name"); } catch (e) {}
    savedText.textContent = "Name cleared. You'll be asked again after your next game."; changeName.hidden = true;
  });

  async function showGameOver() {
    const id = runId, won = state === "won", sc = score;
    showOverlay(won ? "You win!" : "Game over", (won ? "You filled the whole board! " : "") + "Score " + sc, "Play again");
    boardWrap.hidden = false; boardNote.textContent = "Loading leaderboard…"; boardEl.textContent = "";
    let saved = ""; try { saved = localStorage.getItem("snake-name") || ""; } catch (e) {}
    if (saved && isBadName(saved)) { saved = ""; try { localStorage.removeItem("snake-name"); } catch (e) {} }
    if (sc > 0 && saved) {                                   // name already known: save automatically
      nameForm.hidden = true; boardNote.textContent = "Saving score…";
      showSaved(saved);
      const res = await (pendingSave && pendingSave.score === sc ? pendingSave.p : postScore(saved, sc, curMode));
      if (id === runId) renderBoard(res, { name: saved, score: sc });
      return;
    }
    nameForm.hidden = sc <= 0;
    saveBtn.disabled = false;
    if (sc > 0) {
      try { nameInput.value = localStorage.getItem("snake-name") || ""; } catch (e) {}
      if (window.matchMedia("(pointer: fine)").matches) nameInput.focus();
    }
    const res = await loadBoard(curMode);
    if (id === runId && !boardEl.children.length) renderBoard(res);
  }

  nameInput.addEventListener("input", () => nameInput.setCustomValidity(""));
  nameForm.addEventListener("submit", async e => {
    e.preventDefault();
    const name = nameInput.value.trim().slice(0, 12), sc = score, id = runId;
    if (!name) return;
    if (isBadName(nameInput.value)) { nameInput.setCustomValidity("That name isn't allowed. Please pick another."); nameInput.reportValidity(); return; }
    saveBtn.disabled = true;
    try { localStorage.setItem("snake-name", name); } catch (e2) {}
    const res = await postScore(name, sc, curMode);
    if (id !== runId) return;
    nameForm.hidden = true; showSaved(name);
    renderBoard(res, { name, score: sc });
    ovBtn.focus();
  });

  /* ---------- sizing (crisp on any screen; 1x in Performance Mode) ---------- */
  function resize() {
    const dpr = PERF ? 1 : (window.devicePixelRatio || 1);
    const w = Math.round(canvas.clientWidth * dpr);
    canvas.width = w; canvas.height = Math.round(w * LH / LW);
    canvas.style.height = "auto";
    canvas.style.aspectRatio = LW + " / " + LH;
  }
  window.addEventListener("resize", resize);

  function applyConfig() {
    [COLS, ROWS] = MAPS[cfg.map]; INF = cfg.map === "infinite"; curMode = cfg.map + "-" + cfg.speed;
    if (!INF && window.matchMedia("(pointer: fine)").matches) [COLS, ROWS] = [ROWS, COLS];   // PC: invert map sizes (wide instead of tall)
    LW = COLS * CELL; LH = ROWS * CELL;
    cfg.apples = Math.max(1, Math.min(cfg.apples | 0 || 1, COLS * ROWS - 3));
    document.documentElement.style.setProperty("--ar", COLS / ROWS);
    document.documentElement.style.setProperty("--maxw", COLS * 48 + "px");
    setApples.max = COLS * ROWS - 3; setApples.value = cfg.apples; setSpeed.value = cfg.speed; setMap.value = cfg.map;
    applyLook();
    resize();
  }
  for (const el of [setSpeed, setMap, setApples]) el.addEventListener("change", () => {
    cfg.speed = setSpeed.value; cfg.map = setMap.value; cfg.apples = parseInt(setApples.value, 10) || 1;
    saveCfg();
    el.blur(); if (state === "ready") reset();
  });

  /* ---------- settings tab ---------- */
  const setModal = $("setModal");
  let setOpen = false;
  function closeSettings() { setOpen = false; setModal.hidden = true; }
  function openSettings() {
    setOpen = true; if (state === "running") startOrToggle();     // pause the game
    setModal.hidden = false;
  }
  $("setBtn").addEventListener("click", e => { e.currentTarget.blur(); openSettings(); });
  $("setClose").addEventListener("click", closeSettings);
  setModal.addEventListener("click", e => { if (e.target === setModal) closeSettings(); });
  setSnake.addEventListener("input", () => { cfg.snakeColor = setSnake.value; applyLook(); saveCfg(); });
  setMapColor.addEventListener("input", () => { cfg.mapColor = setMapColor.value; applyLook(); saveCfg(); });
  setPerf.addEventListener("change", () => { cfg.perf = setPerf.value; applyLook(); resize(); saveCfg(); setPerf.blur(); });
  setSound.addEventListener("change", () => { cfg.sound = setSound.value; muted = cfg.sound === "off"; saveCfg(); setSound.blur(); });
  $("setReset").addEventListener("click", e => { cfg.snakeColor = DEF_SNAKE; cfg.mapColor = DEF_MAP; applyLook(); saveCfg(); e.currentTarget.blur(); });

  /* ---------- game logic ---------- */
  function reset() {
    clearTimeout(overTimer); runId++; pendingSave = null; applyConfig();
    wallSeed = (Math.random() * 2147483647) | 0;
    const cy = Math.floor(ROWS / 2);
    snake = [{x:5,y:cy},{x:4,y:cy},{x:3,y:cy}];
    prev = snake.map(s => ({...s}));
    dir = DIRS.right; ang = 0; shake = 0; particles = []; queue = []; score = 0; delay = SPEEDS[cfg.speed]; acc = 0; grew = false;
    state = "ready"; scoreEl.textContent = 0;
    foods = [];
    for (let i = 0; i < cfg.apples; i++) placeFood();
    showOverlay("Snake", "Press an arrow key or swipe to start", "Play");
  }

  function placeFood() {
    const taken = new Set(snake.concat(foods).map(c => c.x + "," + c.y));
    const free = [];
    const x0 = INF ? snake[0].x - 8 : 0, y0 = INF ? snake[0].y - 7 : 0;   // infinite: spawn in the view around the head
    for (let y = y0; y < y0 + ROWS; y++) for (let x = x0; x < x0 + COLS; x++)
      if (!taken.has(x + "," + y) && !isWall(x, y)) free.push({x, y});
    if (free.length) { const c = free[Math.floor(Math.random() * free.length)]; foods.push({ x: c.x, y: c.y, born: performance.now() }); }
  }

  function showOverlay(t, s, b) {
    ovTitle.textContent = t; ovSub.textContent = s; ovBtn.textContent = b;
    nameForm.hidden = true; boardWrap.hidden = true; savedNote.hidden = true;
    settingsEl.hidden = !(b === "Play" || b === "Play again");
    overlay.classList.add("show");
  }
  const hideOverlay = () => overlay.classList.remove("show");

  function steer(name) {
    waiting = false;
    const d = DIRS[name], ref = queue.length ? queue[queue.length - 1] : dir;
    if (d === ref || (d.x === -ref.x && d.y === -ref.y) || queue.length >= 2) return;
    queue.push(d);
  }

  function startOrToggle() {
    if (state === "ready") { state = "running"; hideOverlay(); }
    else if (state === "running") { state = "paused"; showOverlay("Paused", "Press Space to resume", "Resume"); return; }
    else if (state === "paused") { state = "running"; hideOverlay(); }
    else if (state === "over" || state === "won") { reset(); state = "running"; hideOverlay(); }
    else return;                          // countdown: nothing to toggle
    waiting = true;                       // hold still until the player presses a direction
    last = performance.now();
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = (!INF && (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS)) || isWall(head.x, head.y);
    const fi = hitWall ? -1 : foods.findIndex(f => f.x === head.x && f.y === head.y), eating = fi >= 0;
    const body = eating ? snake : snake.slice(0, -1);
    if (hitWall || body.some(s => s.x === head.x && s.y === head.y)) { return finish("over"); }

    prev = snake.map(s => ({...s}));
    snake.unshift(head);
    if (eating) {
      prev.push({...prev[prev.length - 1]});            // new tail grows out of the old tail
      score++; scoreEl.textContent = score;
      scoreEl.classList.remove("pop"); void scoreEl.offsetWidth; scoreEl.classList.add("pop");
      burst((foods[fi].x + .5) * CELL, (foods[fi].y + .55) * CELL); beep(520, 920, .12);
      if (score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
      }
      foods.splice(fi, 1); placeFood();
      if (!foods.length) return nextRound();            // map beaten: new round, score carries over
    } else snake.pop();
    if (INF) for (let i = foods.length - 1; i >= 0; i--)      // apples left far behind respawn near the snake
      if (Math.abs(foods[i].x - head.x) > 10 || Math.abs(foods[i].y - head.y) > 9) { foods.splice(i, 1); placeFood(); }
  }

  function nextRound() {          // map beaten: fresh board, keep the score, 3-2-1, then keep going until you die
    wallSeed = (Math.random() * 2147483647) | 0;
    const cy = Math.floor(ROWS / 2);
    snake = [{x:5,y:cy},{x:4,y:cy},{x:3,y:cy}];
    prev = snake.map(s => ({...s}));
    dir = DIRS.right; ang = 0; queue = []; acc = 0; waiting = false;
    foods = []; for (let i = 0; i < cfg.apples; i++) placeFood();
    state = "countdown"; cdT = 0;
    beep(600, 1200, .4);
  }

  function finish(result) {
    if (result === "over") { shake = PERF ? 0 : 1; beep(200, 50, .4, "sawtooth"); } else beep(600, 1200, .4);
    state = result; deathAt = performance.now(); acc = delay;   // freeze at the last full position
    prev = snake.map(s => ({...s}));
    pendingSave = null;                                         // save right away if we already know the player's name
    let nm = ""; try { nm = localStorage.getItem("snake-name") || ""; } catch (e) {}
    if (nm && !isBadName(nm) && score > 0) pendingSave = { score, p: postScore(nm, score, curMode) };
    overTimer = setTimeout(showGameOver, result === "won" ? 300 : 700);
  }

  /* ---------- drawing ---------- */
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t * t * (3 - 2 * t);

  function draw(now) {
    const k = canvas.width / LW, sh = PERF ? 0 : shake * 8 * k;
    ctx.setTransform(k, 0, 0, k, (Math.random() - .5) * sh, (Math.random() - .5) * sh);

    // checkerboard (+ walls in infinite mode)
    let gx = 0, gy = 0;
    if (INF) {
      const t0 = state === "running" || state === "paused" ? Math.min(1, acc / delay) : 1;
      const cx = (lerp(prev[0].x, snake[0].x, t0) + .5) * CELL - LW / 2, cy = (lerp(prev[0].y, snake[0].y, t0) + .5) * CELL - LH / 2;
      ctx.translate(-cx, -cy); gx = Math.floor(cx / CELL); gy = Math.floor(cy / CELL);
    }
    for (let y = gy; y <= gy + ROWS; y++) for (let x = gx; x <= gx + COLS; x++) {
      ctx.fillStyle = (x + y) & 1 ? tileB : tileA;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      if (INF && isWall(x, y)) {
        const wx = x * CELL, wy = y * CELL, o = 3;
        ctx.fillStyle = "#fff"; ctx.fillRect(wx, wy, CELL, CELL);
        ctx.fillStyle = "#000";                                  // outline only on edges not shared with another wall
        if (!isWall(x, y - 1)) ctx.fillRect(wx, wy, CELL, o);
        if (!isWall(x, y + 1)) ctx.fillRect(wx, wy + CELL - o, CELL, o);
        if (!isWall(x - 1, y)) ctx.fillRect(wx, wy, o, CELL);
        if (!isWall(x + 1, y)) ctx.fillRect(wx + CELL - o, wy, o, CELL);
      }
    }

    // food (pops in with a little overshoot, then sits still)
    for (const food of foods) {
      const k = Math.max(0, Math.min(1, (now - food.born) / 260));
      const s = Math.max(0.01, k < 1 ? 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2) : 1);
      drawApple((food.x + .5) * CELL, (food.y + .55) * CELL, s);
    }

    // snake positions, interpolated between ticks
    const t = state === "running" || state === "paused" ? Math.min(1, acc / delay) : 1;
    const P = (x, y) => ({ x: (x + .5) * CELL, y: (y + .5) * CELL });
    const n = snake.length;
    const H = P(lerp(prev[0].x, snake[0].x, t), lerp(prev[0].y, snake[0].y, t));
    const pt = prev[n - 1] || snake[n - 1];
    const T = P(lerp(pt.x, snake[n - 1].x, t), lerp(pt.y, snake[n - 1].y, t));
    // Body path: moving head, then the fixed grid corners, then the moving tail tip.
    // Corners never slide, so the shape stays rigid and doesn't wiggle.
    const V = [H];
    for (let i = 1; i < n; i++) V.push(P(snake[i].x, snake[i].y));
    V.push(T);
    const pts = V.filter((p, i) => i === 0 || Math.hypot(p.x - V[i - 1].x, p.y - V[i - 1].y) > 0.001);
    // note: filter compares against the unfiltered neighbour, which is fine for duplicates

    let alpha = 1;
    if (state === "over") alpha = 0.55 + 0.45 * Math.abs(Math.cos((now - deathAt) / 110)) * Math.max(0, 1 - (now - deathAt) / 700);
    ctx.globalAlpha = alpha;

    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const path = new Path2D();
    path.moveTo(pts[0].x, pts[0].y);
    const R = CELL * 0.5, m = pts.length;
    for (let i = 1; i < m - 1; i++) {
      const d1 = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
      const d2 = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
      const r = Math.min(R, d1 * (i === 1 ? 1 : 0.5), d2 * (i === m - 2 ? 1 : 0.5));
      path.arcTo(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y, r);
    }
    path.lineTo(pts[m - 1].x, pts[m - 1].y);
    if (!PERF) { ctx.save(); ctx.translate(0, 5); ctx.strokeStyle = "rgba(0,0,0,.16)"; ctx.lineWidth = CELL * 0.74; ctx.stroke(path); ctx.restore(); }
    ctx.strokeStyle = SNAKE; ctx.lineWidth = CELL * 0.74; ctx.stroke(path);
    if (!PERF) { ctx.save(); ctx.translate(0, -3); ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = CELL * 0.3; ctx.stroke(path); ctx.restore(); }

    // head
    const h = H, fx = Math.cos(ang), fy = Math.sin(ang), px = -fy, py = fx;
    if (!PERF) { ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.beginPath(); ctx.arc(h.x, h.y + 5, CELL * 0.42, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = SNAKE; ctx.beginPath(); ctx.arc(h.x, h.y, CELL * 0.42, 0, Math.PI * 2); ctx.fill();
    for (const side of [-1, 1]) {
      const ex = h.x + fx * CELL * 0.1 + px * side * CELL * 0.2;
      const ey = h.y + fy * CELL * 0.1 + py * side * CELL * 0.2;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, CELL * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1b2a5c"; ctx.beginPath();
      ctx.arc(ex + fx * CELL * 0.05, ey + fy * CELL * 0.05, CELL * 0.075, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#e7471d";
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.beginPath(); ctx.arc(p.x, p.y, 4 * p.life + 1, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (state === "running" && waiting) {                      // hint while the snake waits
      ctx.setTransform(k, 0, 0, k, 0, 0);
      const w = 300, h = 40, x = LW / 2 - w / 2, y = LH - 64;
      ctx.fillStyle = "rgba(30,55,15,.6)"; ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 20); else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "600 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Press an arrow key or swipe", LW / 2, y + h / 2);
    }
    if (state === "countdown") {                               // 3-2-1 before the next round
      ctx.setTransform(k, 0, 0, k, 0, 0);
      const f = cdT % 1;
      ctx.fillStyle = "rgba(30,55,15,.35)"; ctx.fillRect(0, 0, LW, LH);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 24px sans-serif"; ctx.fillText("Map cleared! Next round starts in", LW / 2, LH / 2 - CELL * 2.6);
      ctx.globalAlpha = 1 - f * .6; ctx.font = "800 " + Math.round(CELL * 3 * (1.15 - f * .3)) + "px sans-serif";
      ctx.fillText(String(Math.ceil(3 - cdT)), LW / 2, LH / 2);
      ctx.globalAlpha = 1;
    }
  }

  const appleImg = new Image(); appleImg.src = "apple.png";
  function drawApple(cx, cy, s) {
    if (!appleImg.complete || !appleImg.naturalWidth) return;      // not loaded yet
    const size = CELL * 0.95 * s, ar = appleImg.naturalWidth / appleImg.naturalHeight;
    const w = ar >= 1 ? size : size * ar, h = ar >= 1 ? size / ar : size;
    if (!PERF) {
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.beginPath(); ctx.ellipse(cx, cy + h * 0.38, w * 0.3, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.drawImage(appleImg, cx - w / 2, cy - h / 2 - CELL * 0.03, w, h);
  }

  /* ---------- main loop ---------- */
  function loop(now) {
    const dt = Math.min((now - (lastFrame || now)) / 1000, .05); lastFrame = now;
    let da = Math.atan2(dir.y, dir.x) - ang; da = Math.atan2(Math.sin(da), Math.cos(da)); ang += da * Math.min(1, dt * 16);
    shake = Math.max(0, shake - dt * 2.5);
    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .93; q.vy *= .93; q.life -= dt * 2.2; }
    particles = particles.filter(q => q.life > 0);
    if (state === "countdown" && !lbOpen && !setOpen && (cdT += dt) >= 3) { state = "running"; acc = 0; last = now; }
    if (state === "running" && !waiting) {
      acc += Math.min(now - last, 100);
      last = now;
      while (acc >= delay && state === "running") { acc -= delay; tick(); }
    } else last = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  /* ---------- leaderboards viewer: 4 maps x 3 speeds = 12 boards, top 5 each ---------- */
  const lbModal = $("lbModal"), lbBody = $("lbBody"), cap = w => w[0].toUpperCase() + w.slice(1);
  let lbOpen = false;
  function closeLb() { lbOpen = false; lbModal.hidden = true; }
  async function openLb() {
    lbOpen = true; if (state === "running") startOrToggle();     // pause the game
    lbModal.hidden = false; lbBody.textContent = "Loading…";
    const maps = Object.keys(MAPS), speeds = Object.keys(SPEEDS);
    const boards = await Promise.all(maps.flatMap(m => speeds.map(sp => loadBoard(m + "-" + sp))));
    if (!lbOpen) return;
    lbBody.textContent = "";
    maps.forEach((m, mi) => {
      const sec = document.createElement("div"); sec.className = "lbMap";
      const h = document.createElement("h3"); h.textContent = cap(m) + " map"; sec.appendChild(h);
      const row = document.createElement("div"); row.className = "lbRow";
      speeds.forEach((sp, si) => {
        const res = boards[mi * speeds.length + si];
        const box = document.createElement("div"); box.className = "lbBox";
        const h4 = document.createElement("h4"); h4.textContent = cap(sp) + (res.global ? "" : " (this device)"); box.appendChild(h4);
        const ol = document.createElement("ol");
        res.rows.filter(r => !isBadName(r.name)).slice(0, 5).forEach((r, i) => {
          const li = document.createElement("li");
          for (const [cls, txt] of [["rk", i + 1], ["nm", r.name], ["sc", r.score]]) {
            const sp2 = document.createElement("span"); sp2.className = cls; sp2.textContent = txt; li.appendChild(sp2);
          }
          ol.appendChild(li);
        });
        if (!res.rows.length) { const li = document.createElement("li"); li.textContent = "No scores yet"; ol.appendChild(li); }
        box.appendChild(ol); row.appendChild(box);
      });
      sec.appendChild(row); lbBody.appendChild(sec);
    });
  }
  $("lbBtn").addEventListener("click", e => { e.currentTarget.blur(); openLb(); });
  $("lbClose").addEventListener("click", closeLb);
  lbModal.addEventListener("click", e => { if (e.target === lbModal) closeLb(); });

  /* ---------- input ---------- */
  window.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (lbOpen || setOpen) { if (e.key === "Escape") { closeLb(); closeSettings(); } return; }
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;     // typing a name
    const name = KEYMAP[e.key];
    if (name) {
      e.preventDefault();
      if (state === "ready") startOrToggle();
      if (state === "running") steer(name);
    } else if (e.code === "Space") {
      e.preventDefault(); if (!e.repeat) startOrToggle();
    } else if (e.key === "m" || e.key === "M") {
      muted = !muted; cfg.sound = muted ? "off" : "on"; setSound.value = cfg.sound; saveCfg();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    } else if (e.key === "Enter" && state !== "running") {
      e.preventDefault(); startOrToggle();
    }
  });

  ovBtn.addEventListener("click", startOrToggle);

  let tx = 0, ty = 0, swiped = false;
  canvas.addEventListener("touchstart", e => {
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; swiped = false; e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    const name = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    tx = t.clientX; ty = t.clientY; swiped = true;          // re-anchor so chained swipes work
    if (state === "ready") startOrToggle();
    if (state === "running") steer(name);
  }, { passive: false });
  canvas.addEventListener("touchend", e => {
    e.preventDefault();
    if (!swiped && state !== "over" && state !== "won") startOrToggle();
  }, { passive: false });

  const autoPause = () => { if (state === "running") startOrToggle(); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) autoPause(); });
  window.addEventListener("blur", autoPause);

  reset();
  requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
